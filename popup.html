<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 280px;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #15202b; /* X Dark Theme background */
            color: white;
            text-align: center;
        }
        h3 { margin-top: 0; font-weight: 800; }
        p { font-size: 13px; color: #8899a6; margin-bottom: 20px; }
        
        button {
            width: 100%;
            padding: 12px;
            background-color: #1d9bf0; /* X Blue */
            color: white;
            border: none;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #1a8cd8; }
        
        /* Settings Section */
        .settings {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #38444d;
            text-align: left;
        }
        .settings-title {
            font-size: 12px;
            font-weight: 600;
            color: #8899a6;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }
        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .setting-label {
            font-size: 14px;
            color: #e7e9ea;
        }
        .setting-description {
            font-size: 11px;
            color: #71767b;
            margin-top: 2px;
        }
        
        /* Toggle Switch */
        .toggle {
            position: relative;
            width: 44px;
            height: 24px;
            flex-shrink: 0;
        }
        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #38444d;
            transition: 0.2s;
            border-radius: 24px;
        }
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.2s;
            border-radius: 50%;
        }
        .toggle input:checked + .toggle-slider {
            background-color: #1d9bf0;
        }
        .toggle input:checked + .toggle-slider:before {
            transform: translateX(20px);
        }
        
        /* API Key Input */
        .setting-input {
            margin-top: 4px;
        }
        .setting-input input {
            width: 100%;
            padding: 10px 12px;
            background-color: #273340;
            border: 1px solid #38444d;
            border-radius: 8px;
            color: #e7e9ea;
            font-size: 13px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .setting-input input:focus {
            outline: none;
            border-color: #1d9bf0;
        }
        .setting-input input::placeholder {
            color: #71767b;
        }

        /* Batch Capture */
        .batch-section {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #38444d;
        }
        #snapPageBtn {
            background-color: transparent;
            border: 1px solid #38444d;
            color: #e7e9ea;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
        }
        #snapPageBtn:hover:not(:disabled) {
            background-color: rgba(29, 155, 240, 0.1);
            border-color: #1d9bf0;
            color: #1d9bf0;
        }
        #snapPageBtn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        #snapPageBtn svg { fill: currentColor; flex-shrink: 0; }
        .batch-status {
            font-size: 12px;
            color: #71767b;
            margin-top: 8px;
            min-height: 16px;
            text-align: center;
        }
        .batch-status.error { color: #f4212e; }
        .batch-status.success { color: #00ba7c; }
        .batch-progress-mini {
            margin-top: 6px;
            height: 3px;
            background: #38444d;
            border-radius: 2px;
            overflow: hidden;
            display: none;
        }
        .batch-progress-mini .fill {
            width: 0%;
            height: 100%;
            background: #1d9bf0;
            border-radius: 2px;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <h3>Xnap</h3>
    <p>Your personal tweet knowledge base.</p>
    <button id="openAlbumBtn">Open</button>

    <div class="batch-section">
        <button id="snapPageBtn" disabled>
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 10.8c-1.77 0-3.2 1.43-3.2 3.2s1.43 3.2 3.2 3.2 3.2-1.43 3.2-3.2-1.43-3.2-3.2-3.2zM18 4h-3.17L13 2H11L9.17 4H6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-6 14c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
            Snap this page
        </button>
        <div class="batch-progress-mini"><div class="fill"></div></div>
        <div id="batchStatus" class="batch-status"></div>
    </div>
    
    <div class="settings">
        <div class="settings-title">Settings</div>
        
        <div class="setting-row">
            <div>
                <div class="setting-label">Enable AI</div>
                <div class="setting-description">Summary & keywords</div>
            </div>
            <label class="toggle">
                <input type="checkbox" id="aiEnabled" checked>
                <span class="toggle-slider"></span>
            </label>
        </div>
        
        <div class="setting-row" style="display: block;">
            <div class="setting-label">AI API Key</div>
            <div class="setting-input">
                <input type="password" id="aiApiKey" placeholder="Enter API key...">
            </div>
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
