<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Xnap</title>
    <link rel="stylesheet" href="styles.css">
    <script src="lib/jszip.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Toggle Button (outside sidebar so it stays visible when collapsed) -->
        <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">
            <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Xnap</h2>
                <button id="resetFilters" class="reset-btn" title="Reset all filters">
                    <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                </button>
            </div>
            <!-- Resize Handle with grip lines -->
            <div class="sidebar-resize-handle" id="sidebarResizeHandle">
                <div class="resize-grip"></div>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search text or tags...">
            </div>
            
            <h3>Date Range</h3>
            <div class="date-filter">
                <div class="date-inputs">
                    <input type="date" id="dateFrom" title="From date">
                    <span>to</span>
                    <input type="date" id="dateTo" title="To date">
                </div>
            </div>
            
            <h3>Accounts</h3>
            <div id="accountList" class="facet-list"></div>
            
            <h3>Hashtags</h3>
            <div id="hashtagList" class="facet-list"></div>
            
            <h3>Keywords</h3>
            <div id="keywordCloud" class="keyword-cloud"></div>
            
            <h3>Albums</h3>
            <div id="albumList" class="facet-list">
                <div class="facet-item album-facet active" data-album="all">
                    <span class="facet-content">All Snapshots</span>
                </div>
            </div>
        </aside>

        <main class="gallery">
            <header>
                <div class="header-title">
                    <h1>Gallery</h1>
                    <span id="snapshotCount" class="snapshot-count"></span>
                </div>
                <div class="header-actions">
                    <button id="exportBtn" title="Export visible snapshots as ZIP">
                        <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2v9.67z"/></svg>
                        Export
                    </button>
                    <button id="deleteAlbumBtn" class="danger-btn" title="Delete selected album and all its snapshots">
                        <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M9 3v1H4v2h1v13c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V6h1V4h-5V3H9zm0 5h2v9H9V8zm4 0h2v9h-2V8z"/></svg>
                        Delete Album
                    </button>
                    <button id="deleteAllBtn" class="danger-btn">Delete</button>
                </div>
            </header>
            <div id="grid" class="grid-container">
                </div>
        </main>
    </div>

    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script type="module" src="viewer.js"></script>
</body>
</html>
